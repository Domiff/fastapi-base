<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ subject }}</title>
  <style>
    @media (max-width: 620px) {
      .card, .brand, .footer { padding-left: 24px !important; padding-right: 24px !important; }
      .title { font-size: 26px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#f6f7f9; color:#1f2933;
             font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
             -webkit-font-smoothing:antialiased;">

  <div style="padding:40px 16px;">
    <div style="max-width:600px; margin:0 auto;">

      <div class="brand" style="padding:0 40px 24px; text-align:center;
                                font-size:17px; font-weight:600; letter-spacing:-.01em;">
        {{ app_name }}
      </div>

      <div style="background:#ffffff; border:1px solid #e4e7eb; border-radius:12px; overflow:hidden;">

        <div style="height:3px; background:#3b6ef5;"></div>

        <div class="card" style="padding:44px 48px;">

          <h1 class="title" style="margin:0; font-size:30px; font-weight:600; line-height:1.15;
                                   letter-spacing:-.03em;">{{ title }}</h1>

          <p style="margin:16px 0 0; color:#6b7280;">{{ body }}</p>

          {% if link %}
          <div style="margin-top:32px;">
            <a href="{{ link }}"
               style="display:inline-block; padding:13px 30px; border-radius:999px;
                      background:#3b6ef5; color:#ffffff; font-size:15px; line-height:1; text-decoration:none;">
              {{ action or "Перейти" }}
            </a>
          </div>
          {% endif %}

        </div>
      </div>

      <div class="footer" style="padding:24px 40px 0; text-align:center;
                                 font-size:13px; line-height:1.6; color:#6b7280;">
        Письмо отправлено автоматически, отвечать на него не нужно.
      </div>

    </div>
  </div>

</body>
</html>
