{% extends "sqladmin/base.html" %}

{% block body %}
<div class="ta-login">
  <div class="ta-login-box">
    <div class="ta-login-brand">
      {% if admin.logo_url or admin.favicon_url %}
      <img src="{{ admin.logo_url or admin.favicon_url }}" alt="">
      {% else %}
      <span class="ta-brand-mark ta-brand-mark-lg">{{ admin.title[:1] }}</span>
      {% endif %}
      <h1>{{ admin.title }}</h1>
      <p>{{ _("Login to %(title)s", title=admin.title) }}</p>
    </div>

    <form class="card" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label" for="username">Email</label>
          <input id="username" name="username" type="email" class="form-control {% if error %}is-invalid{% endif %}"
            placeholder="admin@example.com" autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">{{ _("Password") }}</label>
          <input id="password" name="password" type="password" class="form-control {% if error %}is-invalid{% endif %}"
            placeholder="{{ _('Password') }}" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">{{ _("Login") }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
